<!doctype html>
<html lang="en-GB" data-theme="unicorn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe4f3">
  <meta name="description" content="$siteDescription$">
  <title>$if(title)$$title$ · $endif$$siteTitle$</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="alternate" type="application/rss+xml" title="$siteTitle$ RSS" href="/feed.xml">
  <script src="/js/wander.js" defer></script>
  <script>
    (function () {
      var colors = { dark: "#0a0c10", light: "#f7f6f2", unicorn: "#ffe4f3" };
      var stored = localStorage.getItem("theme");
      var theme = Object.prototype.hasOwnProperty.call(colors, stored) ? stored : "unicorn";
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", colors[theme]);
    })();
  </script>
  <script src="/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="site-mark" href="/" aria-label="$siteTitle$ home">
      <span class="site-mark__glyph" aria-hidden="true">λ</span>
      <span>$siteTitle$</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="/">Writing</a>
      <a href="/inspiration/">Inspiration</a>
      <a href="/about/">About</a>
      <a href="https://github.com/chrisgrounds" class="icon-link nav-github" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cycle color theme">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--rainbow" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
          <path d="M3 18a9 9 0 0 1 18 0" stroke="#ff5da2" stroke-width="2" stroke-linecap="round"></path>
          <path d="M6 18a6 6 0 0 1 12 0" stroke="#ffd166" stroke-width="2" stroke-linecap="round"></path>
          <path d="M9 18a3 3 0 0 1 6 0" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
      <button type="button" id="command-palette-trigger" class="cmdk-trigger" aria-label="Open command palette">⌘K</button>
    </nav>
  </header>

  <dialog id="command-palette" aria-label="Command palette">
    <div class="command-palette__box">
      <input id="command-palette-input" type="text" placeholder="Search articles or run a command…" autocomplete="off" spellcheck="false" aria-label="Search commands" aria-controls="command-palette-list">
      <ul id="command-palette-list" class="command-palette__list" role="listbox"></ul>
      <div id="command-palette-articles" hidden>
        $for(commandPosts)$
          <a href="$url$" data-wander-date="$wanderDate$" data-wander-tags="$wanderTags$">$title$</a>
        $endfor$
      </div>
    </div>
  </dialog>

  <dialog id="wander-dialog" class="wander" aria-labelledby="wander-title" aria-describedby="wander-instructions">
    <div class="wander__shell">
      <header class="wander__header">
        <div>
          <p class="eyebrow">Wander mode</p>
          <h2 id="wander-title">A constellation of ideas</h2>
        </div>
        <button type="button" id="wander-close" class="wander__close" aria-label="Close Wander mode">Close <span aria-hidden="true">×</span></button>
      </header>

      <div class="wander__stage">
        <svg id="wander-map" class="wander__map" viewBox="0 0 1000 620" role="group" aria-label="Interactive map of articles"></svg>
      </div>

      <footer class="wander__footer">
        <div id="wander-status" class="wander__status" role="status" aria-live="polite">
          <h3 id="wander-status-title"></h3>
          <p id="wander-status-details"></p>
          <p id="wander-status-relation" class="wander__relation"></p>
        </div>
        <div class="wander__actions">
          <p id="wander-instructions">Use arrow keys to drift · Enter to read · Escape to leave</p>
          <a id="wander-open" class="wander__open" href="#">Read article <span aria-hidden="true">→</span></a>
        </div>
      </footer>
    </div>
  </dialog>

  <main id="content" class="site-main">
    $body$
  </main>

  <footer class="site-footer">
    <p>Built with <a href="https://jaspervdj.be/hakyll/">Hakyll</a>.</p>
  </footer>
</body>
</html>
