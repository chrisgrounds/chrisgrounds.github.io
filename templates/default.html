<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0c10">
  <meta name="description" content="$siteDescription$">
  <title>$if(title)$$title$ · $endif$$siteTitle$</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="alternate" type="application/rss+xml" title="$siteTitle$ RSS" href="/feed.xml">
  <script>
    (function () {
      var THEMES = ["dark", "light", "unicorn"];
      var THEME_COLORS = { dark: "#0a0c10", light: "#f7f6f2", unicorn: "#ffe4f3" };

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", THEME_COLORS[theme] || THEME_COLORS.dark);
      }

      var stored = localStorage.getItem("theme");
      var initial = THEMES.indexOf(stored) !== -1
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      applyTheme(initial);

      document.addEventListener("click", function (event) {
        if (!event.target.closest("#theme-toggle")) return;
        var current = document.documentElement.getAttribute("data-theme");
        var next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
        applyTheme(next);
        localStorage.setItem("theme", next);
      });

      var THEME_LABELS = { dark: "Dark", light: "Light", unicorn: "Unicorn 🦄" };

      function setTheme(theme) {
        applyTheme(theme);
        localStorage.setItem("theme", theme);
      }

      var COMMANDS = THEMES.map(function (theme) {
        return {
          id: "theme-" + theme,
          group: "Theme",
          label: "Theme: " + THEME_LABELS[theme],
          run: function () { setTheme(theme); }
        };
      }).concat([
        { id: "go-writing", group: "Go to", label: "Writing", run: function () { window.location.href = "/"; } },
        { id: "go-inspiration", group: "Go to", label: "Inspiration", run: function () { window.location.href = "/inspiration/"; } },
        { id: "go-about", group: "Go to", label: "About", run: function () { window.location.href = "/about/"; } },
        { id: "go-github", group: "Go to", label: "GitHub", run: function () { window.location.href = "https://github.com/chrisgrounds"; } }
      ]);

      var activeIndex = 0;
      var visible = COMMANDS;

      function renderCommands() {
        var list = document.getElementById("command-palette-list");
        if (!list) return;
        list.innerHTML = "";
        visible.forEach(function (command, index) {
          var item = document.createElement("li");
          item.id = "command-palette-option-" + command.id;
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", index === activeIndex ? "true" : "false");
          item.className = "command-palette__item" + (index === activeIndex ? " is-active" : "");

          var label = document.createElement("span");
          label.textContent = command.label;
          item.appendChild(label);

          var group = document.createElement("span");
          group.className = "command-palette__group";
          group.textContent = command.group;
          item.appendChild(group);

          item.addEventListener("click", function () { runCommand(index); });
          item.addEventListener("mousemove", function () {
            if (activeIndex !== index) { activeIndex = index; renderCommands(); }
          });

          list.appendChild(item);
        });

        var input = document.getElementById("command-palette-input");
        if (input) {
          if (visible[activeIndex]) {
            input.setAttribute("aria-activedescendant", "command-palette-option-" + visible[activeIndex].id);
          } else {
            input.removeAttribute("aria-activedescendant");
          }
        }
      }

      function filterCommands(query) {
        var q = query.trim().toLowerCase();
        visible = !q
          ? COMMANDS
          : COMMANDS.filter(function (command) {
              return command.label.toLowerCase().indexOf(q) !== -1 || command.group.toLowerCase().indexOf(q) !== -1;
            });
        activeIndex = 0;
        renderCommands();
      }

      function moveActive(delta) {
        if (!visible.length) return;
        activeIndex = (activeIndex + delta + visible.length) % visible.length;
        renderCommands();
        var active = document.querySelector(".command-palette__item.is-active");
        if (active) active.scrollIntoView({ block: "nearest" });
      }

      function runCommand(index) {
        var command = visible[index];
        if (!command) return;
        closePalette();
        command.run();
      }

      function openPalette() {
        var dialog = document.getElementById("command-palette");
        var input = document.getElementById("command-palette-input");
        if (!dialog || !input) return;
        input.value = "";
        filterCommands("");
        dialog.showModal();
        input.focus();
      }

      function closePalette() {
        var dialog = document.getElementById("command-palette");
        if (dialog && dialog.open) dialog.close();
      }

      document.addEventListener("keydown", function (event) {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          var dialog = document.getElementById("command-palette");
          if (dialog && dialog.open) closePalette();
          else openPalette();
        }
      });

      document.addEventListener("click", function (event) {
        if (event.target.closest("#command-palette-trigger")) openPalette();
      });

      document.addEventListener("click", function (event) {
        var dialog = document.getElementById("command-palette");
        if (dialog && event.target === dialog) dialog.close();
      });

      document.addEventListener("input", function (event) {
        if (event.target && event.target.id === "command-palette-input") filterCommands(event.target.value);
      });

      document.addEventListener("keydown", function (event) {
        if (!event.target || event.target.id !== "command-palette-input") return;
        if (event.key === "ArrowDown") { event.preventDefault(); moveActive(1); }
        else if (event.key === "ArrowUp") { event.preventDefault(); moveActive(-1); }
        else if (event.key === "Enter") { event.preventDefault(); runCommand(activeIndex); }
      });

      // A secret: ↑ ↑ ↓ ↓ ← → ← → grows a lambda tree and blooms unicorn mode.
      var KONAMI = ["arrowup", "arrowup", "arrowdown", "arrowdown", "arrowleft", "arrowright", "arrowleft", "arrowright"];
      var KONAMI_GLYPHS = { arrowup: "↑", arrowdown: "↓", arrowleft: "←", arrowright: "→" };
      var konamiProgress = 0;
      var konamiResetTimer = null;
      var eggActive = false;

      var konamiOverlay = null;

      function buildKonamiOverlay() {
        var overlay = document.createElement("div");
        overlay.className = "konami-progress";
        overlay.setAttribute("aria-hidden", "true");
        document.body.appendChild(overlay);
        return overlay;
      }

      // Only renders the keys typed so far — never the keys still to come,
      // so the overlay can't be used to read off the rest of the sequence.
      function updateKonamiOverlay(progress) {
        if (!konamiOverlay) konamiOverlay = buildKonamiOverlay();
        konamiOverlay.innerHTML = "";
        for (var i = 0; i < progress; i++) {
          var glyph = document.createElement("span");
          glyph.className = "konami-progress__glyph is-filled";
          glyph.textContent = KONAMI_GLYPHS[KONAMI[i]] || "?";
          konamiOverlay.appendChild(glyph);
        }
        konamiOverlay.classList.toggle("is-visible", progress > 0);
      }

      document.addEventListener("keydown", function (event) {
        var dialog = document.getElementById("command-palette");
        if (dialog && dialog.open) return;
        var active = document.activeElement;
        if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable)) return;

        var key = event.key.toLowerCase();
        konamiProgress = key === KONAMI[konamiProgress] ? konamiProgress + 1 : (key === KONAMI[0] ? 1 : 0);
        updateKonamiOverlay(konamiProgress);

        clearTimeout(konamiResetTimer);
        if (konamiProgress > 0) {
          konamiResetTimer = setTimeout(function () {
            konamiProgress = 0;
            updateKonamiOverlay(0);
          }, 1200);
        }

        if (konamiProgress === KONAMI.length) {
          konamiProgress = 0;
          updateKonamiOverlay(0);
          triggerEasterEgg();
        }
      });

      function triggerEasterEgg() {
        if (eggActive) return;
        eggActive = true;
        setTheme("unicorn");
        showToast("🦄 the λ-tree blooms");

        var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduceMotion) { eggActive = false; return; }
        growLambdaTree(function () { eggActive = false; });
      }

      function showToast(text) {
        var toast = document.createElement("div");
        toast.className = "easter-egg-toast";
        toast.setAttribute("role", "status");
        toast.setAttribute("aria-live", "polite");
        toast.textContent = text;
        document.body.appendChild(toast);

        requestAnimationFrame(function () {
          requestAnimationFrame(function () { toast.classList.add("is-visible"); });
        });

        setTimeout(function () {
          toast.classList.remove("is-visible");
          setTimeout(function () { toast.remove(); }, 350);
        }, 2400);
      }

      // Same fractal all day (seeded by today's date), a new one tomorrow.
      function growLambdaTree(onDone) {
        var canvas = document.createElement("canvas");
        canvas.className = "easter-egg-canvas";
        canvas.setAttribute("aria-hidden", "true");
        document.body.appendChild(canvas);
        var ctx = canvas.getContext("2d");

        function resize() {
          var dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener("resize", resize);

        var now = new Date();
        var startOfYear = new Date(now.getFullYear(), 0, 0);
        var dayOfYear = Math.floor((now - startOfYear) / 86400000);
        var seed = now.getFullYear() * 1000 + dayOfYear;

        function nodeRandom(pathSeed) {
          var x = Math.imul(pathSeed ^ seed, 2654435761);
          x = (x ^ (x >>> 15)) >>> 0;
          return x / 4294967296;
        }

        var COLORS = ["#ff5da2", "#ffd166", "#6ee7b7", "#60a5fa", "#a78bfa"];
        var colorOffset = seed % COLORS.length;
        var spread = 0.5 + nodeRandom(1) * 0.5;
        var maxDepth = 9;

        function drawBranch(x, y, len, angle, depth, pathSeed) {
          if (len < 4 || depth <= 0) return;
          var x2 = x + Math.cos(angle) * len;
          var y2 = y - Math.sin(angle) * len;

          ctx.strokeStyle = COLORS[(colorOffset + (maxDepth - depth)) % COLORS.length];
          ctx.lineWidth = Math.max(1, depth * 0.6);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x2, y2);
          ctx.stroke();

          if (depth === 1) {
            ctx.fillStyle = COLORS[(colorOffset + 2) % COLORS.length];
            ctx.font = Math.max(10, len) + "px Georgia, serif";
            ctx.fillText("λ", x2 - 4, y2 + 4);
            return;
          }

          var varianceL = (nodeRandom(pathSeed * 2 + 1) - 0.5) * spread;
          var varianceR = (nodeRandom(pathSeed * 2 + 2) - 0.5) * spread;
          drawBranch(x2, y2, len * 0.72, angle - 0.42 + varianceL, depth - 1, pathSeed * 2 + 1);
          drawBranch(x2, y2, len * 0.72, angle + 0.42 + varianceR, depth - 1, pathSeed * 2 + 2);
        }

        var progressDepth = 1;
        var lastStep = null;
        var holdStart = null;
        var STEP_MS = 130;
        var HOLD_MS = 1600;
        var FADE_MS = 700;

        function frame(ts) {
          if (lastStep === null) lastStep = ts;
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          if (progressDepth <= maxDepth) {
            if (ts - lastStep > STEP_MS) {
              progressDepth += 1;
              lastStep = ts;
            }
            drawBranch(window.innerWidth / 2, window.innerHeight * 0.86, window.innerHeight * 0.16, Math.PI / 2, progressDepth, 1);
            requestAnimationFrame(frame);
            return;
          }

          drawBranch(window.innerWidth / 2, window.innerHeight * 0.86, window.innerHeight * 0.16, Math.PI / 2, maxDepth, 1);

          if (holdStart === null) holdStart = ts;
          if (ts - holdStart < HOLD_MS) {
            requestAnimationFrame(frame);
            return;
          }

          canvas.classList.add("is-fading");
          setTimeout(function () {
            window.removeEventListener("resize", resize);
            canvas.remove();
            if (onDone) onDone();
          }, FADE_MS);
        }

        requestAnimationFrame(frame);
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="site-mark" href="/" aria-label="$siteTitle$ home">
      <span class="site-mark__glyph" aria-hidden="true">λ</span>
      <span>$siteTitle$</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="/">Writing</a>
      <a href="/inspiration/">Inspiration</a>
      <a href="/about/">About</a>
      <a href="https://github.com/chrisgrounds" class="icon-link nav-github" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cycle color theme">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--rainbow" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
          <path d="M3 18a9 9 0 0 1 18 0" stroke="#ff5da2" stroke-width="2" stroke-linecap="round"></path>
          <path d="M6 18a6 6 0 0 1 12 0" stroke="#ffd166" stroke-width="2" stroke-linecap="round"></path>
          <path d="M9 18a3 3 0 0 1 6 0" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
      <button type="button" id="command-palette-trigger" class="cmdk-trigger" aria-label="Open command palette">⌘K</button>
    </nav>
  </header>

  <dialog id="command-palette" aria-label="Command palette">
    <div class="command-palette__box">
      <input id="command-palette-input" type="text" placeholder="Switch theme or jump to a page…" autocomplete="off" spellcheck="false" aria-label="Search commands" aria-controls="command-palette-list">
      <ul id="command-palette-list" class="command-palette__list" role="listbox"></ul>
    </div>
  </dialog>

  <main id="content" class="site-main">
    $body$
  </main>

  <footer class="site-footer">
    <p>Written by Chris Grounds.</p>
    <p>Typeset in HTML. Built with <a href="https://jaspervdj.be/hakyll/">Hakyll</a>.</p>
  </footer>
</body>
</html>
