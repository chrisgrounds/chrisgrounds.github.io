<article class="article page-section">
  <header class="article__header">
    <h1 class="page-heading">$title$</h1>
    <div class="article__meta">
      <time datetime="$date$">$date$</time>
      $if(tags)$<span aria-hidden="true">/</span><span>$tags$</span>$endif$
      $if(pangram_url)$
      <a class="article__pangram" href="$pangram_url$"><span aria-hidden="true">✍️</span>Verified as human written - check with Pangram <span aria-hidden="true">↗</span></a>
      $endif$
    </div>
  </header>

  <div class="prose page-content">
    $body$
  </div>

  <footer class="article__footer">
    <a href="/">← All writing</a>
  </footer>
</article>
