name: Deploy Hakyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GHC_VERSION: "9.6.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ghcup installs GHC under /usr/local/.ghcup on hosted runners. Restoring
      # the install lets setup find it instead of reinstalling (~3 min).
      - name: Cache GHC
        uses: actions/cache@v4
        with:
          path: /usr/local/.ghcup/ghc/${{ env.GHC_VERSION }}
          key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}

      - name: Set up Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "3.14.2.0"

      - name: Cache Cabal packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-cabal-
            ${{ runner.os }}-cabal-

      - name: Build site generator
        run: cabal build -j

      - name: Build site
        run: cabal run site -- build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
