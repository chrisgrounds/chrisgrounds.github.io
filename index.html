---
title: Writing
---

<section class="post-index" aria-labelledby="writing-heading">
  <div class="section-heading">
    <h1 class="page-heading" id="writing-heading">Latest writing</h1>
  </div>

  <div class="post-list page-content">
    $for(posts)$
      <article class="post-card">
        <div class="post-card__meta">
          <time datetime="$date$">$date$</time>
          $if(tags)$<span aria-hidden="true">/</span><span>$tags$</span>$endif$
        </div>
        <h3><a href="$url$">$title$</a></h3>
      </article>
    $endfor$
  </div>
</section>
